# netrics self-hosted: the same published images as the hosted service.
# Configure with .env (created by ./install.sh; see README.md), then:
#   docker compose up -d
#
# Only Caddy publishes ports (80/443, automatic HTTPS). PostgreSQL, the API
# and the web app are reachable only on the internal network.

x-server: &server
  image: ghcr.io/netrics-so/server:${NETRICS_VERSION:?set NETRICS_VERSION in .env}
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_USER: netrics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: netrics
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netrics -d netrics"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs on every `up`: applies migrations, assigns the application roles'
  # passwords, and syncs the connector catalog. Then exits.
  migrate:
    image: ghcr.io/netrics-so/server:${NETRICS_VERSION}
    command: ["node", "dist/migrate.js"]
    restart: "no"
    environment:
      DATABASE_MIGRATION_URL: postgres://netrics:${POSTGRES_PASSWORD}@postgres:5432/netrics
      NETRICS_APP_DB_PASSWORD: ${NETRICS_APP_DB_PASSWORD:?set NETRICS_APP_DB_PASSWORD in .env}
      NETRICS_SCHEDULER_DB_PASSWORD: ${NETRICS_SCHEDULER_DB_PASSWORD:?set NETRICS_SCHEDULER_DB_PASSWORD in .env}
      # Preview connectors to turn on (README, "Preview connectors"); the
      # catalog sync, the api and the worker must agree.
      NETRICS_PREVIEW_CONNECTORS: ${NETRICS_PREVIEW_CONNECTORS:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *server
    environment:
      NETRICS_ROLE: api
      HOST: 0.0.0.0
      PORT: "3001"
      DATABASE_URL: postgres://netrics_app:${NETRICS_APP_DB_PASSWORD}@postgres:5432/netrics
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
      APP_ENCRYPTION_KEYS_PREVIOUS: ${APP_ENCRYPTION_KEYS_PREVIOUS:-}
      BETTER_AUTH_URL: ${NETRICS_PUBLIC_URL:?set NETRICS_PUBLIC_URL in .env}
      WEB_ORIGIN: ${NETRICS_PUBLIC_URL}
      NETRICS_SIGNUP: ${NETRICS_SIGNUP:-closed}
      NETRICS_SETUP_TOKEN: ${NETRICS_SETUP_TOKEN:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      NETRICS_OAUTH_GOOGLE_CLIENT_ID: ${NETRICS_OAUTH_GOOGLE_CLIENT_ID:-}
      NETRICS_OAUTH_GOOGLE_CLIENT_SECRET: ${NETRICS_OAUTH_GOOGLE_CLIENT_SECRET:-}
      NETRICS_PROXY_SECRET: ${NETRICS_PROXY_SECRET:-}
      # Display currency (#191): "ecb" (default) or "off". Set the same on
      # the scheduler.
      NETRICS_EXCHANGE_RATES: ${NETRICS_EXCHANGE_RATES:-ecb}
      # Default language (ADR 0016): "en" (unset) or "de". Set the same on
      # the web app.
      NETRICS_DEFAULT_LOCALE: ${NETRICS_DEFAULT_LOCALE:-}
      # Workspace image quota (#217): images and MiB per workspace.
      NETRICS_IMAGE_QUOTA_COUNT: ${NETRICS_IMAGE_QUOTA_COUNT:-100}
      NETRICS_IMAGE_QUOTA_MIB: ${NETRICS_IMAGE_QUOTA_MIB:-50}
      # Custom API limits (README, "Custom API limits").
      NETRICS_CUSTOM_API_MAX_DEFINITIONS: ${NETRICS_CUSTOM_API_MAX_DEFINITIONS:-50}
      NETRICS_CUSTOM_API_MAX_STREAMS: ${NETRICS_CUSTOM_API_MAX_STREAMS:-20}
      NETRICS_CUSTOM_API_MAX_CONNECTIONS: ${NETRICS_CUSTOM_API_MAX_CONNECTIONS:-100}
      NETRICS_CUSTOM_API_MIN_REFRESH_MINUTES: ${NETRICS_CUSTOM_API_MIN_REFRESH_MINUTES:-15}
      # Self-hosting only: hosts or ranges custom APIs may reach on your own
      # network (README, "Custom APIs on your own network"); unset: none.
      # Set the same on the worker.
      NETRICS_CUSTOM_API_PRIVATE_HOSTS: ${NETRICS_CUSTOM_API_PRIVATE_HOSTS:-}
      # Self-hosting only: hosts or ranges a connector's configured host (a
      # self-hosted PostHog) may resolve to on your own network (README,
      # "Connectors on your own network"); unset: none. Set the same on the
      # worker.
      NETRICS_CONNECTOR_PRIVATE_HOSTS: ${NETRICS_CONNECTOR_PRIVATE_HOSTS:-}
      # Self-hosting only: a PEM file in ./certs with extra certificate
      # authorities to trust, e.g. your network's own CA (README, "Custom APIs
      # on your own network"); unset: the public ones only. Set the same on
      # the worker.
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      NETRICS_DATA_POLICY: ${NETRICS_DATA_POLICY:-}
      # Where TVs send people to approve a pairing code; default
      # <NETRICS_PUBLIC_URL>/devices/approve.
      NETRICS_PAIRING_URL: ${NETRICS_PAIRING_URL:-}
      # Sign-in and sign-up rate limits: "on" (default in production) or "off".
      NETRICS_AUTH_RATE_LIMIT: ${NETRICS_AUTH_RATE_LIMIT:-}
      # Proxies whose forwarded client address the API believes; default
      # loopback,linklocal,uniquelocal (the Compose network).
      NETRICS_TRUSTED_PROXIES: ${NETRICS_TRUSTED_PROXIES:-}
      # Preview connectors to turn on (currently none); unset: none. Set the
      # same on migrate and the worker.
      NETRICS_PREVIEW_CONNECTORS: ${NETRICS_PREVIEW_CONNECTORS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./certs:/etc/netrics/certs:ro

  worker:
    <<: *server
    environment:
      NETRICS_ROLE: worker
      DATABASE_URL: postgres://netrics_app:${NETRICS_APP_DB_PASSWORD}@postgres:5432/netrics
      DATABASE_SCHEDULER_URL: postgres://netrics_scheduler:${NETRICS_SCHEDULER_DB_PASSWORD}@postgres:5432/netrics
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      APP_ENCRYPTION_KEYS_PREVIOUS: ${APP_ENCRYPTION_KEYS_PREVIOUS:-}
      # The worker refreshes OAuth access tokens, so it needs the clients too.
      NETRICS_DATA_POLICY: ${NETRICS_DATA_POLICY:-}
      NETRICS_OAUTH_GOOGLE_CLIENT_ID: ${NETRICS_OAUTH_GOOGLE_CLIENT_ID:-}
      NETRICS_OAUTH_GOOGLE_CLIENT_SECRET: ${NETRICS_OAUTH_GOOGLE_CLIENT_SECRET:-}
      # History loads (backfills) of one connector's OAuth connections that
      # run at a time; they share the OAuth app's quota. 0: no cap. See
      # README, "Google connectors".
      WORKER_BACKFILLS_PER_APP: ${WORKER_BACKFILLS_PER_APP:-4}
      # The worker syncs only connectors it has, so it reads the same opt-in.
      NETRICS_PREVIEW_CONNECTORS: ${NETRICS_PREVIEW_CONNECTORS:-}
      # The worker runs custom API syncs, so it reads the same private hosts.
      NETRICS_CUSTOM_API_PRIVATE_HOSTS: ${NETRICS_CUSTOM_API_PRIVATE_HOSTS:-}
      # ... the same connector private hosts (it syncs PostHog)
      NETRICS_CONNECTOR_PRIVATE_HOSTS: ${NETRICS_CONNECTOR_PRIVATE_HOSTS:-}
      # ... and trusts the same extra certificate authorities.
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      # The worker copies custom API item images after a sync, within their
      # own quota (README, "Images").
      NETRICS_CUSTOM_API_IMAGE_QUOTA_COUNT: ${NETRICS_CUSTOM_API_IMAGE_QUOTA_COUNT:-500}
      NETRICS_CUSTOM_API_IMAGE_QUOTA_MIB: ${NETRICS_CUSTOM_API_IMAGE_QUOTA_MIB:-200}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./certs:/etc/netrics/certs:ro

  scheduler:
    <<: *server
    environment:
      NETRICS_ROLE: scheduler
      DATABASE_SCHEDULER_URL: postgres://netrics_scheduler:${NETRICS_SCHEDULER_DB_PASSWORD}@postgres:5432/netrics
      # Fetches the ECB reference rates daily unless "off" (no request to
      # the ECB then).
      NETRICS_EXCHANGE_RATES: ${NETRICS_EXCHANGE_RATES:-ecb}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  web:
    image: ghcr.io/netrics-so/web:${NETRICS_VERSION}
    restart: unless-stopped
    environment:
      NETRICS_API_URL: http://api:3001
      NETRICS_PROXY_SECRET: ${NETRICS_PROXY_SECRET:-}
      NETRICS_DEFAULT_LOCALE: ${NETRICS_DEFAULT_LOCALE:-}
      # Proxies in front of the web server (Caddy here: 1), or a header one
      # of them sets with the client address. See README, "Another proxy".
      NETRICS_TRUSTED_PROXY_HOPS: ${NETRICS_TRUSTED_PROXY_HOPS:-}
      NETRICS_CLIENT_IP_HEADER: ${NETRICS_CLIENT_IP_HEADER:-}
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    ports:
      # Same port inside and out, so the public URL is the site address.
      # Change NETRICS_HTTPS_PORT (and NETRICS_PUBLIC_URL) only when the host
      # already serves 443.
      - "${NETRICS_HTTP_PORT:-80}:80"
      - "${NETRICS_HTTPS_PORT:-443}:${NETRICS_HTTPS_PORT:-443}"
    environment:
      NETRICS_SITE_ADDRESS: ${NETRICS_DOMAIN:?set NETRICS_DOMAIN in .env}:${NETRICS_HTTPS_PORT:-443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Optional nightly database dump into ./backups (14 days kept):
  #   docker compose --profile backup up -d
  # One dump now (README, "Backup and restore"), optionally labelled:
  #   docker compose --profile backup run --rm --no-deps -e BACKUP_ONCE=1 backup
  #   ... -e BACKUP_ONCE=1 -e BACKUP_LABEL=before-restore backup
  # Files are named netrics-<version>-<commit>-<time>.dump after the release
  # that last migrated the database (schema_info, written by migrate), read
  # at dump time, so they stay right across upgrades.
  # Dumps hold all data, so only their owner may read them: ./backups is made
  # mode 700, and each dump mode 600 and owned by whoever owns ./backups
  # (install.sh creates it as the installing user).
  backup:
    profiles: ["backup"]
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # New dumps are mode 600 through the umask alone. Handing them and the
        # folder to the owner of ./backups is best effort: some mounts (NFS
        # root_squash, SMB, user namespaces) refuse it, and a backup must not
        # be lost over that.
        umask 077
        chmod 700 /backups ||
          echo "backup: warning: could not make ./backups mode 700; restrict it on the host" >&2
        owner=$$(stat -c %u:%g /backups)
        # Dumps written before this were readable by every user on the host.
        find /backups -name 'netrics-*.dump' -exec chmod 600 {} + ||
          echo "backup: warning: could not make older dumps mode 600" >&2
        while true; do
          release=$$(psql -h postgres -U netrics -d netrics -Atc "select coalesce(max(value) filter (where key = 'netrics_version'), 'unknown') || '-' || coalesce(left(max(value) filter (where key = 'netrics_commit'), 12), 'unknown') from schema_info" | sed 's/[^A-Za-z0-9._-]/_/g')
          label=$$(printf '%s' "$${BACKUP_LABEL:-}" | sed 's/[^A-Za-z0-9._-]/_/g')
          file=/backups/netrics-$${release:-unknown}-$$(date -u +%Y%m%dT%H%M%SZ)$${label:+-$$label}.dump
          # Written under a temporary name and renamed only when complete:
          # a failed dump never looks like a backup.
          if pg_dump -h postgres -U netrics -d netrics -Fc -f "$$file.partial"; then
            chown "$$owner" "$$file.partial" ||
              echo "backup: warning: could not give the dump to $$owner (owner of ./backups); it stays mode 600, owned by the container's root" >&2
            mv "$$file.partial" "$$file" && echo "backup: $$file"
          else
            rm -f "$$file.partial"
            echo "backup failed" >&2
            exit 1
          fi
          find /backups -name 'netrics-*.dump' -mtime +14 -delete
          [ -z "$${BACKUP_ONCE:-}" ] || exit 0
          sleep 86400
        done
    # Dumps start after migrate, so they never see a half-migrated database
    # and always carry the running release.
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  caddy_data:
  caddy_config:
