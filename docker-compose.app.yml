# Optional: run the production app images together with PostgreSQL.
# Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up --build
# Apply migrations from the host (or CI) before/while starting:
#   pnpm db:migrate
services:
  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgres://netrics_app:netrics_app@postgres:5432/netrics
      PORT: "3001"
      HOST: 0.0.0.0
      NETRICS_ROLE: api
      # Dev-only auth secret (the image runs with NODE_ENV=production, which
      # requires it to be set); replace with a real secret in any real
      # deployment, e.g. `openssl rand -base64 32`.
      BETTER_AUTH_SECRET: netrics-dev-only-insecure-secret-000000
      BETTER_AUTH_URL: http://localhost:3001
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NETRICS_API_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      - api
