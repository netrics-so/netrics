# Local smoke test of the app images together with the dev PostgreSQL. This
# is NOT a deployment: the images run with NODE_ENV=development so the public
# development secrets and plain-http localhost URLs apply. Production
# refuses both. The supported self-hosted install lives in deploy/compose (#43).
# Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up --build
# Apply migrations (and dev role passwords) from the host before starting:
#   pnpm db:migrate
services:
  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgres://netrics_app:netrics_app@postgres:5432/netrics
      PORT: "3001"
      HOST: 0.0.0.0
      NETRICS_ROLE: api
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  # Job worker: claims and executes durable jobs (connector syncs etc.).
  # Horizontally scalable — run more replicas for more throughput.
  worker:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgres://netrics_app:netrics_app@postgres:5432/netrics
      DATABASE_SCHEDULER_URL: postgres://netrics_scheduler:netrics_scheduler@postgres:5432/netrics
      NETRICS_ROLE: worker
      WORKER_CONCURRENCY: "4"
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy

  # Due-sync planner. Exactly one active instance (enforced by a PostgreSQL
  # advisory lock): extra replicas exit until the holder dies.
  scheduler:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgres://netrics_app:netrics_app@postgres:5432/netrics
      DATABASE_SCHEDULER_URL: postgres://netrics_scheduler:netrics_scheduler@postgres:5432/netrics
      NETRICS_ROLE: scheduler
      NODE_ENV: development
      SCHEDULER_POLL_MS: "5000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NETRICS_API_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      - api
