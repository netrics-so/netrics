# Optional: run the production app images together with PostgreSQL.
# Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up --build
# Apply migrations from the host (or CI) before/while starting:
#   pnpm db:migrate
services:
  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgres://netrics_app:netrics_app@postgres:5432/netrics
      PORT: "3001"
      HOST: 0.0.0.0
      NETRICS_ROLE: api
      # Dev-only auth secret (the image runs with NODE_ENV=production, which
      # requires it to be set); replace with a real secret in any real
      # deployment, e.g. `openssl rand -base64 32`.
      BETTER_AUTH_SECRET: netrics-dev-only-insecure-secret-000000
      # Dev-only credential encryption key (the image runs with
      # NODE_ENV=production, which requires it); replace with a real key in any
      # real deployment, e.g. `openssl rand -base64 32`.
      APP_ENCRYPTION_KEY: bmV0cmljcy1kZXYtb25seS1pbnNlY3VyZS1rZXkhITE=
      BETTER_AUTH_URL: http://localhost:3001
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  # Job worker: claims and executes durable jobs (connector syncs etc.).
  # Horizontally scalable — run more replicas for more throughput.
  worker:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgres://netrics_app:netrics_app@postgres:5432/netrics
      DATABASE_SCHEDULER_URL: postgres://netrics_scheduler:netrics_scheduler@postgres:5432/netrics
      NETRICS_ROLE: worker
      WORKER_CONCURRENCY: "4"
      # Dev-only credential encryption key (see api above); replace in any
      # real deployment.
      APP_ENCRYPTION_KEY: bmV0cmljcy1kZXYtb25seS1pbnNlY3VyZS1rZXkhITE=
    depends_on:
      postgres:
        condition: service_healthy

  # Due-sync planner. Exactly one active instance (enforced by a PostgreSQL
  # advisory lock): extra replicas exit until the holder dies.
  scheduler:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgres://netrics_app:netrics_app@postgres:5432/netrics
      DATABASE_SCHEDULER_URL: postgres://netrics_scheduler:netrics_scheduler@postgres:5432/netrics
      NETRICS_ROLE: scheduler
      SCHEDULER_POLL_MS: "5000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # The rewrite destinations (/api/auth/*, /v1/*) are baked in at build
        # time, so this must be a build arg, not just a runtime env var.
        NETRICS_API_URL: http://api:3001
    environment:
      NETRICS_API_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      - api
