name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: netrics
          POSTGRES_PASSWORD: netrics
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netrics -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # Integration tests (packages/database) create and migrate scratch
      # databases on this server.
      NETRICS_TEST_ADMIN_URL: postgres://netrics:netrics@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The committed OpenAPI document must match the code (clients such as
      # the tvOS app are generated from it). Fix with `pnpm openapi`.
      - run: pnpm openapi:check

  # One source, same commit (ADR 0013): the web build must not depend on its
  # environment. Builds apps/web twice from a clean .next, with only the
  # build identity and with sample NETRICS_* configuration, and fails if the
  # output differs (apps/web/scripts/build-env-check.ts, #160).
  web-build-env:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:build-check

  # netrics TV (apps/netrics-tv) on Xcode 27 and the 27 SDKs: the package
  # tests of NetricsKit and NetricsUI (they build for macOS too, including
  # the vectors shared with packages/domain, #215), NetricsUI for iOS (#409)
  # and unsigned builds of the tvOS and iOS apps (#410). GitHub's
  # macos-26 image only carries Xcode 26; Xcode 27 is on the `xcode-27`
  # image (actions/runner-images#14404, preview, macOS 27 based since
  # 2026-09-16). DEVELOPER_DIR pins the Xcode version instead of the image
  # default.
  netrics-tv:
    runs-on: xcode-27
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version && swift --version
      - name: NetricsKit and NetricsUI tests
        run: swift test
        working-directory: apps/netrics-tv/NetricsKit
      - name: Build NetricsUI for iOS
        run: >-
          xcodebuild -scheme NetricsUI
          -destination 'generic/platform=iOS Simulator'
          build CODE_SIGNING_ALLOWED=NO
        working-directory: apps/netrics-tv/NetricsKit
      - name: Build the tvOS app (unsigned)
        run: >-
          xcodebuild -project apps/netrics-tv/NetricsTV.xcodeproj
          -scheme NetricsTV -configuration Debug
          -destination 'generic/platform=tvOS Simulator'
          build CODE_SIGNING_ALLOWED=NO
      - name: Build the iOS app (unsigned)
        run: >-
          xcodebuild -project apps/netrics-tv/NetricsTV.xcodeproj
          -scheme NetricsTVTouch -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          build CODE_SIGNING_ALLOWED=NO

  migrations:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: netrics
          POSTGRES_PASSWORD: netrics
          POSTGRES_DB: netrics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netrics -d netrics"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_MIGRATION_URL: postgres://netrics:netrics@localhost:5432/netrics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to an empty database
        run: pnpm db:migrate
      - name: Re-apply migrations (idempotency check)
        run: pnpm db:migrate

  # Release images are published for both platforms (release.yml); build each
  # natively so an arm64-only breakage shows up on the pull request.
  docker:
    name: docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build server image
        run: docker build -f apps/server/Dockerfile -t netrics-server:ci .
      # better-auth's optional peers once pulled Next.js into the server
      # image (~590 MB, #81); .pnpmfile.cjs drops them. Keep it that way.
      - name: Check server image size
        run: |
          size=$(docker image inspect netrics-server:ci --format '{{.Size}}')
          echo "server image: $((size / 1000000)) MB"
          test "$size" -lt 250000000 || { echo "::error::server image is over 250 MB"; exit 1; }
          if docker run --rm --entrypoint sh netrics-server:ci -c 'ls node_modules/.pnpm | grep -E "^(next|drizzle-kit|vitest)@"'; then
            echo "::error::server image contains web or build tooling"
            exit 1
          fi
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t netrics-web:ci .
      # Proxies in front of the web server reuse idle connections for up to
      # 60 s (Railway's edge) or 2 min (Caddy); the server must keep them
      # open longer, or requests fail sporadically with 502/503 (#195). Node
      # announces its keep-alive timeout in the Keep-Alive response header.
      - name: Check web keep-alive timeout
        run: |
          docker run -d --name web-keepalive -p 127.0.0.1:3000:3000 netrics-web:ci
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/healthz && break
            sleep 1
          done
          timeout=$(curl -s -D - -o /dev/null http://127.0.0.1:3000/healthz | tr -d '\r' | sed -n 's/^keep-alive: *timeout=\([0-9]*\).*/\1/Ip')
          echo "web keep-alive timeout: ${timeout:-none} s"
          docker rm -f web-keepalive >/dev/null
          test "${timeout:-0}" -gt 120 || { echo "::error::web server closes idle connections before the proxy does"; exit 1; }

  # The supported self-hosted install must keep working end to end: build the
  # images from this commit, run install.sh, start deploy/compose, and complete
  # first-run setup over HTTPS through Caddy.
  selfhost:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build images
        run: |
          docker build -q -f apps/server/Dockerfile -t ghcr.io/netrics-so/server:ci .
          docker build -q -f apps/web/Dockerfile -t ghcr.io/netrics-so/web:ci .
      - name: Install and start
        working-directory: deploy/compose
        run: |
          ./install.sh --domain localhost --version ci
          docker compose up -d
          for i in $(seq 1 60); do
            state=$(docker compose ps --format '{{.Service}}={{.Health}}' | tr '\n' ' ')
            case "$state" in *api=healthy*web=healthy*) break ;; esac
            sleep 3
          done
          docker compose ps
      - name: Complete setup over HTTPS
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          url=https://localhost
          token=$(sed -n 's/^NETRICS_SETUP_TOKEN=//p' .env)
          check() { test "$1" = "$2" || { echo "expected $2, got $1: $3"; exit 1; }; }
          check "$(curl -sk -o /dev/null -w '%{http_code}' $url/healthz)" 200 healthz
          check "$(curl -sk $url/v1/setup-status)" '{"setupRequired":true,"signup":"closed"}' setup-status
          check "$(curl -sk -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -H "origin: $url" \
            -d '{"name":"x","email":"x@example.com","password":"password-12345"}' $url/api/auth/sign-up/email)" 403 closed-signup
          check "$(curl -sk -c jar -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -H "origin: $url" \
            -H "x-netrics-setup-token: $token" \
            -d '{"name":"Owner","email":"owner@example.com","password":"password-12345"}' $url/api/auth/sign-up/email)" 200 setup
          check "$(curl -sk -b jar -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -H "origin: $url" \
            -d '{"name":"CI"}' $url/v1/workspaces)" 200 workspace
          check "$(curl -sk -b jar -o /dev/null -w '%{http_code}' $url/v1/admin/workspaces)" 200 admin-api
          docker compose run --rm migrate node dist/admin-cli.js list-tokens
          # Auth is rate-limited per client IP through Caddy, web and api:
          # forged X-Forwarded-For values must not buy more attempts.
          for i in $(seq 1 10); do
            check "$(curl -sk -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -H "origin: $url" \
              -H "x-forwarded-for: 198.51.100.$i" -H "x-real-ip: 198.51.100.$i" \
              -d '{"email":"owner@example.com","password":"wrong-password-1"}' $url/api/auth/sign-in/email)" 401 "sign-in $i"
          done
          check "$(curl -sk -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -H "origin: $url" \
            -H 'x-forwarded-for: 198.51.100.99' \
            -d '{"email":"owner@example.com","password":"wrong-password-1"}' $url/api/auth/sign-in/email)" 429 rate-limit
      - name: Google OAuth app configuration
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          announced() { docker compose logs --no-color api | grep 'oauth providers configured' || true; }
          # Unconfigured (the default): the api starts and lists no provider.
          case "$(announced)" in *'"oauthProviders":[]'*) ;; *) echo "expected no oauth provider"; exit 1 ;; esac
          # Configured as deploy/compose/google-oauth.md describes: api and
          # worker start, and the api logs the redirect URI to register.
          printf '%s\n' NETRICS_OAUTH_GOOGLE_CLIENT_ID=ci.apps.googleusercontent.com \
            NETRICS_OAUTH_GOOGLE_CLIENT_SECRET=ci-oauth-secret >> .env
          docker compose up -d
          expected='"redirectUri":"https://localhost/oauth/google/callback"'
          for i in $(seq 1 60); do
            case "$(announced)" in *"$expected"*) break ;; esac
            sleep 2
          done
          case "$(announced)" in *"$expected"*) ;; *) echo "expected $expected"; exit 1 ;; esac
          if docker compose logs --no-color api worker | grep ci-oauth-secret >/dev/null; then
            echo "client secret in logs"; exit 1
          fi
          test "$(docker compose ps --format '{{.Service}}={{.State}}' worker)" = worker=running
      - name: Logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --tail 100

  # Release signing only runs on main (release.yml, promote.yml), so a cosign
  # or cosign-installer update would otherwise first meet it in a release.
  # This job runs the same cosign commands against a throwaway multi-arch
  # image in a registry local to the job: sign --recursive, attest an SPDX
  # SBOM per platform and on the index, then verify the way promote.yml and
  # docs/release.md do. Keyless (GitHub OIDC, public Fulcio and Rekor) when
  # the run gets an ID token; pull requests from forks and Dependabot do not,
  # and fall back to a throwaway key without the transparency log.
  signing:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # keyless signing, as in release.yml
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Same cosign-installer as the release workflows
        run: |
          pins=$(grep -hoE 'sigstore/cosign-installer@[0-9a-f]{40}' .github/workflows/release.yml .github/workflows/promote.yml .github/workflows/ci.yml | sort -u)
          echo "$pins"
          test "$(echo "$pins" | wc -l)" -eq 1 || { echo "::error::cosign-installer pins differ between workflows"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign, attest and verify a throwaway image
        run: |
          set -euo pipefail
          cosign version
          repo=localhost:5000/netrics-ci/signing
          tmp=$(mktemp -d)
          printf 'FROM scratch\nCOPY run-id /run-id\n' > "$tmp/Dockerfile"
          echo "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > "$tmp/run-id"
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false \
            --output "type=image,name=$repo:ci,push=true,registry.insecure=true" "$tmp"
          index=$(curl -fsS -o /dev/null -D - -H 'Accept: application/vnd.oci.image.index.v1+json' \
            "http://localhost:5000/v2/netrics-ci/signing/manifests/ci" | tr -d '\r' | sed -n 's/^docker-content-digest: *//Ip')
          echo "index: $index"

          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "mode: keyless"
            sign=()
            check=(--certificate-identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF"
              --certificate-oidc-issuer https://token.actions.githubusercontent.com)
          else
            echo "mode: throwaway key, no transparency log (no ID token for this run)"
            COSIGN_PASSWORD="" cosign generate-key-pair --output-key-prefix "$tmp/cosign"
            export COSIGN_PASSWORD=""
            sign=(--key "$tmp/cosign.key" --tlog-upload=false --use-signing-config=false)
            check=(--key "$tmp/cosign.pub" --insecure-ignore-tlog)
          fi

          # As release.yml.
          cosign sign --yes --recursive "${sign[@]}" "$repo@$index"
          curl -fsS -H 'Accept: application/vnd.oci.image.index.v1+json' \
            "http://localhost:5000/v2/netrics-ci/signing/manifests/$index" |
            jq -r '.manifests[] | "\(.platform.architecture) \(.digest)"' > "$tmp/platforms"
          test "$(cut -d' ' -f1 "$tmp/platforms" | sort | tr '\n' ' ')" = "amd64 arm64 "
          while read -r arch platform_digest <&3; do
            sbom="$tmp/$arch.spdx.json"
            jq -n --arg arch "$arch" '{spdxVersion: "SPDX-2.3", dataLicense: "CC0-1.0", SPDXID: "SPDXRef-DOCUMENT",
              name: "ci-\($arch)", documentNamespace: "https://example.invalid/ci/\($arch)",
              creationInfo: {created: "2026-01-01T00:00:00Z", creators: ["Tool: ci"]}, packages: []}' > "$sbom"
            cosign attest --yes "${sign[@]}" --type spdxjson --predicate "$sbom" "$repo@$platform_digest"
            cosign attest --yes "${sign[@]}" --type spdxjson --predicate "$sbom" "$repo@$index"
          done 3< "$tmp/platforms"

          # As promote.yml, on the index and on each platform manifest.
          while read -r arch digest; do
            cosign verify "${check[@]}" "$repo@$digest" > /dev/null
            cosign verify-attestation --type spdxjson "${check[@]}" "$repo@$digest" > /dev/null
          done < <(echo "index $index"; cat "$tmp/platforms")

          # As docs/release.md: by tag, reading the predicate back.
          names=$(cosign verify-attestation --type spdxjson "${check[@]}" "$repo:ci" |
            jq -r .payload | base64 -d | jq -r .predicate.name | sort | tr '\n' ' ')
          echo "index attestations: $names"
          test "$names" = "ci-amd64 ci-arm64 "
