name: release

# Publishes immutable, signed, commit-addressed images to GHCR and hands the
# digests to the private netrics-cloud release workflow. Terraform never owns
# the image-version field; this workflow does. Version tags (vX.Y.Z) do not
# rebuild: promote.yml tags the images this workflow built for that commit.
# See docs/release.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/netrics-so

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: netrics
          POSTGRES_PASSWORD: netrics
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netrics -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # Integration tests create and migrate scratch databases on this server.
      NETRICS_TEST_ADMIN_URL: postgres://netrics:netrics@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  migrations:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: netrics
          POSTGRES_PASSWORD: netrics
          POSTGRES_DB: netrics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netrics -d netrics"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_MIGRATION_URL: postgres://netrics:netrics@localhost:5432/netrics
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to an empty database
        run: pnpm db:migrate
      - name: Re-apply migrations (idempotency check)
        run: pnpm db:migrate

  # One native build per image and platform (no QEMU), pushed by digest only.
  # The publish job assembles the multi-arch index and tags it.
  build:
    needs: [verify, migrations]
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [server, web, renderer]
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Determine release version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # Server and renderer read APP_VERSION/GIT_SHA, web reads the
          # NEXT_PUBLIC_ pair; each Dockerfile ignores the other.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_APP_VERSION=${{ steps.meta.outputs.version }}
            NEXT_PUBLIC_GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform.arch }}

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          echo "$DIGEST" > "digests/${{ matrix.image }}-${{ matrix.platform.arch }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # Assembles each multi-arch index, tags it with the commit SHA, signs it
  # (index and platform manifests) and attests an SPDX SBOM per platform.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing via sigstore GitHub OIDC
    outputs:
      version: ${{ steps.publish.outputs.version }}
      server: ${{ steps.publish.outputs.server }}
      web: ${{ steps.publish.outputs.web }}
      renderer: ${{ steps.publish.outputs.renderer }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        id: syft

      - name: Create, sign and attest multi-arch images
        id: publish
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          # Package-to-file ownership edges multiply the SBOM size without
          # adding packages; Rekor rejects entries above ~23 MiB.
          SYFT_RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP: "false"
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p sbom
          {
            echo "## Release candidate"
            echo
            echo "- release: $version"
            echo "- commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

          for image in server web renderer; do
            repo="$IMAGE_PREFIX/$image"
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=$SOURCE" \
              --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
              --annotation "index:org.opencontainers.image.version=$version" \
              --tag "$repo:$GITHUB_SHA" \
              "$repo@$(cat "digests/$image-amd64")" \
              "$repo@$(cat "digests/$image-arm64")"
            index=$(docker buildx imagetools inspect "$repo:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)

            # --recursive signs the index and each platform manifest, so both
            # a tag (resolves to the index) and a platform digest verify.
            cosign sign --yes --recursive "$repo@$index"

            # Platform manifests as listed in the index. (The digests the build
            # jobs pushed are per-platform indexes carrying BuildKit
            # provenance; imagetools flattens them, so they are not what
            # clients pull.)
            docker buildx imagetools inspect --raw "$repo@$index" |
              jq -r '.manifests[] | select(.platform.os == "linux") | "\(.platform.architecture) \(.digest)"' \
              > "platforms-$image"
            test "$(cut -d' ' -f1 "platforms-$image" | sort | tr '\n' ' ')" = "amd64 arm64 "

            while read -r arch platform_digest <&3; do
              sbom="sbom/$image-linux-$arch.spdx.json"
              "$SYFT" scan "registry:$repo@$platform_digest" -o "spdx-json=$sbom"
              ls -l "$sbom"
              cosign attest --yes --type spdxjson --predicate "$sbom" "$repo@$platform_digest"
              cosign attest --yes --type spdxjson --predicate "$sbom" "$repo@$index"
            done 3< "platforms-$image"

            echo "$image=$repo@$index" >> "$GITHUB_OUTPUT"
            echo "- $image: \`$repo@$index\` (linux/amd64, linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom/*.spdx.json
          if-no-files-found: error

  dispatch:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve secrets from 1Password
        id: secrets
        uses: ./.github/actions/op-secrets
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      # The dispatch authenticates as the netrics Release Bot GitHub App
      # (installed on netrics-cloud only, Contents: write). App credentials
      # come from 1Password; the installation token minted here lives for one
      # hour and is never stored. No personal access token is involved.
      - name: Mint Release Bot installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ steps.secrets.outputs.release-bot-app-id }}
          private-key: ${{ steps.secrets.outputs.release-bot-private-key }}
          owner: netrics-so
          repositories: netrics-cloud

      - name: Trigger netrics-cloud release workflow
        env:
          CLOUD_DISPATCH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE: ${{ needs.publish.outputs.version }}
          COMMIT: ${{ github.sha }}
          SERVER_DIGEST_REF: ${{ needs.publish.outputs.server }}
          WEB_DIGEST_REF: ${{ needs.publish.outputs.web }}
          RENDERER_DIGEST_REF: ${{ needs.publish.outputs.renderer }}
        run: |
          if [ -z "$CLOUD_DISPATCH_TOKEN" ]; then
            echo "::error::Release Bot token is empty. Check the OP_SERVICE_ACCOUNT_TOKEN secret and the 1Password 'GitHub Release Bot' item (see docs/release.md), then retry with workflow_dispatch."
            exit 1
          fi
          payload=$(jq -n \
            --arg release "$RELEASE" \
            --arg commit "$COMMIT" \
            --arg server "$SERVER_DIGEST_REF" \
            --arg web "$WEB_DIGEST_REF" \
            --arg renderer "$RENDERER_DIGEST_REF" \
            '{
              event_type: "release-candidate",
              client_payload: {
                release: $release,
                commit: $commit,
                images: {
                  server: $server,
                  web: $web,
                  renderer: $renderer
                }
              }
            }')
          curl -sfL -X POST \
            -H "Authorization: Bearer $CLOUD_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/netrics-so/netrics-cloud/dispatches \
            -d "$payload"
