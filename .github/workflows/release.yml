name: release

# Publishes immutable, signed, commit-addressed images to GHCR and hands the
# digests to the private netrics-cloud release workflow. Terraform never owns
# the image-version field; this workflow does. Version tags (vX.Y.Z) do not
# rebuild: promote.yml tags the images this workflow built for that commit.
# See docs/release.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/netrics-so

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: netrics
          POSTGRES_PASSWORD: netrics
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netrics -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # Integration tests create and migrate scratch databases on this server.
      NETRICS_TEST_ADMIN_URL: postgres://netrics:netrics@localhost:5432/postgres
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The parent commit tells a release commit from a later main
          # build (scripts/release/version.ts).
          fetch-depth: 2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      # X.Y.Z for the commit that sets the package.json version (the one a
      # release tag goes on), X.Y.Z+<commit> for every later main build.
      - name: Determine the build version
        id: version
        run: |
          set -euo pipefail
          version=$(node scripts/release/version.ts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build version: $version"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  migrations:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: netrics
          POSTGRES_PASSWORD: netrics
          POSTGRES_DB: netrics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netrics -d netrics"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_MIGRATION_URL: postgres://netrics:netrics@localhost:5432/netrics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to an empty database
        run: pnpm db:migrate
      - name: Re-apply migrations (idempotency check)
        run: pnpm db:migrate

  # One native build per image and platform (no QEMU), pushed by digest only.
  # The publish job assembles the multi-arch index and tags it.
  build:
    needs: [verify, migrations]
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [server, web]
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # The server reads APP_VERSION/GIT_SHA, web reads the
          # NEXT_PUBLIC_ pair; each Dockerfile ignores the other.
          build-args: |
            APP_VERSION=${{ needs.verify.outputs.version }}
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_APP_VERSION=${{ needs.verify.outputs.version }}
            NEXT_PUBLIC_GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
          # The runtime stage runs `apk upgrade`; never reuse it from the
          # cache, or a release ships Alpine packages older than the ones CI
          # scanned (#906). It is small: Alpine, the Node binary, the app.
          no-cache-filters: runner

      # The exact image that gets signed and deployed must pass the same
      # checks as CI (#906): Alpine packages can change between the CI build
      # and this one. A failure stops the release before anything is signed.
      - name: Check the pushed image
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull -q "$IMAGE"
          scripts/check-image.sh "$IMAGE"

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          echo "$DIGEST" > "digests/${{ matrix.image }}-${{ matrix.platform.arch }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # Assembles each multi-arch index, tags it with the commit SHA, signs it
  # (index and platform manifests) and attests an SPDX SBOM per platform.
  publish:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing via sigstore GitHub OIDC
    outputs:
      version: ${{ steps.publish.outputs.version }}
      server: ${{ steps.publish.outputs.server }}
      web: ${{ steps.publish.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft

      - name: Create, sign and attest multi-arch images
        id: publish
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          # Package-to-file ownership edges multiply the SBOM size without
          # adding packages; Rekor rejects entries above ~23 MiB.
          SYFT_RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP: "false"
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p sbom
          {
            echo "## Release candidate"
            echo
            echo "- release: $version"
            echo "- commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

          for image in server web; do
            repo="$IMAGE_PREFIX/$image"
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=$SOURCE" \
              --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
              --annotation "index:org.opencontainers.image.version=$version" \
              --tag "$repo:$GITHUB_SHA" \
              "$repo@$(cat "digests/$image-amd64")" \
              "$repo@$(cat "digests/$image-arm64")"
            index=$(docker buildx imagetools inspect "$repo:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)

            # --recursive signs the index and each platform manifest, so both
            # a tag (resolves to the index) and a platform digest verify.
            cosign sign --yes --recursive "$repo@$index"

            # Platform manifests as listed in the index. (The digests the build
            # jobs pushed are per-platform indexes carrying BuildKit
            # provenance; imagetools flattens them, so they are not what
            # clients pull.)
            docker buildx imagetools inspect --raw "$repo@$index" |
              jq -r '.manifests[] | select(.platform.os == "linux") | "\(.platform.architecture) \(.digest)"' \
              > "platforms-$image"
            test "$(cut -d' ' -f1 "platforms-$image" | sort | tr '\n' ' ')" = "amd64 arm64 "

            while read -r arch platform_digest <&3; do
              sbom="sbom/$image-linux-$arch.spdx.json"
              "$SYFT" scan "registry:$repo@$platform_digest" -o "spdx-json=$sbom"
              ls -l "$sbom"
              cosign attest --yes --type spdxjson --predicate "$sbom" "$repo@$platform_digest"
              cosign attest --yes --type spdxjson --predicate "$sbom" "$repo@$index"
            done 3< "platforms-$image"

            echo "$image=$repo@$index" >> "$GITHUB_OUTPUT"
            echo "- $image: \`$repo@$index\` (linux/amd64, linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/*.spdx.json
          if-no-files-found: error

  dispatch:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve secrets from 1Password
        id: secrets
        uses: ./.github/actions/op-secrets
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      # The dispatch authenticates as the netrics Release Bot GitHub App
      # (installed on netrics-cloud only, Contents: write). App credentials
      # come from 1Password; the installation token minted here lives for one
      # hour and is never stored. No personal access token is involved.
      - name: Mint Release Bot installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ steps.secrets.outputs.release-bot-app-id }}
          private-key: ${{ steps.secrets.outputs.release-bot-private-key }}
          owner: netrics-so
          repositories: netrics-cloud

      - name: Trigger netrics-cloud release workflow
        env:
          CLOUD_DISPATCH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE: ${{ needs.publish.outputs.version }}
          COMMIT: ${{ github.sha }}
          SERVER_DIGEST_REF: ${{ needs.publish.outputs.server }}
          WEB_DIGEST_REF: ${{ needs.publish.outputs.web }}
        run: |
          if [ -z "$CLOUD_DISPATCH_TOKEN" ]; then
            echo "::error::Release Bot token is empty. Check the OP_SERVICE_ACCOUNT_TOKEN secret and the 1Password 'GitHub Release Bot' item (see docs/release.md), then retry with workflow_dispatch."
            exit 1
          fi
          payload=$(jq -n \
            --arg release "$RELEASE" \
            --arg commit "$COMMIT" \
            --arg server "$SERVER_DIGEST_REF" \
            --arg web "$WEB_DIGEST_REF" \
            '{
              event_type: "release-candidate",
              client_payload: {
                release: $release,
                commit: $commit,
                images: {
                  server: $server,
                  web: $web
                }
              }
            }')
          curl -sfL -X POST \
            -H "Authorization: Bearer $CLOUD_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/netrics-so/netrics-cloud/dispatches \
            -d "$payload"
