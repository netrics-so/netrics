name: release

# Publishes immutable, signed, commit-addressed images to GHCR and hands the
# digests to the private netrics-cloud release workflow. Terraform never owns
# the image-version field; this workflow does. See docs/release.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/netrics-so/server
  WEB_IMAGE: ghcr.io/netrics-so/web
  RENDERER_IMAGE: ghcr.io/netrics-so/renderer

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: netrics
          POSTGRES_PASSWORD: netrics
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netrics -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # Integration tests create and migrate scratch databases on this server.
      NETRICS_TEST_ADMIN_URL: postgres://netrics:netrics@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: netrics
          POSTGRES_PASSWORD: netrics
          POSTGRES_DB: netrics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netrics -d netrics"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_MIGRATION_URL: postgres://netrics:netrics@localhost:5432/netrics
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to an empty database
        run: pnpm db:migrate
      - name: Re-apply migrations (idempotency check)
        run: pnpm db:migrate

  release:
    needs: [verify, migrations]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing via sigstore GitHub OIDC
    steps:
      - uses: actions/checkout@v4

      - name: Determine release version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        id: build-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ${{ env.SERVER_IMAGE }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Resolve web rewrite API URL
        id: web-api-url
        run: |
          if [ -z "${{ vars.NETRICS_WEB_API_URL }}" ]; then
            echo "::warning::NETRICS_WEB_API_URL repo variable is not set; the web image will proxy to http://localhost:3001, which is wrong for any deployed environment. Set it to the API's private-networking URL (see docs/release.md)."
            echo "url=http://localhost:3001" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ vars.NETRICS_WEB_API_URL }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push web image
        id: build-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.meta.outputs.version }}
            NEXT_PUBLIC_GIT_SHA=${{ github.sha }}
            NETRICS_API_URL=${{ steps.web-api-url.outputs.url }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push renderer image
        id: build-renderer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/renderer/Dockerfile
          push: true
          tags: ${{ env.RENDERER_IMAGE }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=renderer
          cache-to: type=gha,mode=max,scope=renderer

      - name: Record image digests
        run: |
          {
            echo "SERVER_DIGEST_REF=${SERVER_IMAGE}@${{ steps.build-server.outputs.digest }}"
            echo "WEB_DIGEST_REF=${WEB_IMAGE}@${{ steps.build-web.outputs.digest }}"
            echo "RENDERER_DIGEST_REF=${RENDERER_IMAGE}@${{ steps.build-renderer.outputs.digest }}"
          } >> "$GITHUB_ENV"
          {
            echo "## Release candidate"
            echo
            echo "- release: ${{ steps.meta.outputs.version }}"
            echo "- commit: ${{ github.sha }}"
            echo "- server: \`${SERVER_IMAGE}@${{ steps.build-server.outputs.digest }}\`"
            echo "- web: \`${WEB_IMAGE}@${{ steps.build-web.outputs.digest }}\`"
            echo "- renderer: \`${RENDERER_IMAGE}@${{ steps.build-renderer.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images (keyless)
        run: |
          cosign sign --yes "$SERVER_DIGEST_REF"
          cosign sign --yes "$WEB_DIGEST_REF"
          cosign sign --yes "$RENDERER_DIGEST_REF"

      - name: Generate server SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.SERVER_DIGEST_REF }}
          artifact-name: sbom-server

      - name: Generate web SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.WEB_DIGEST_REF }}
          artifact-name: sbom-web

      - name: Generate renderer SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.RENDERER_DIGEST_REF }}
          artifact-name: sbom-renderer

      - name: Resolve secrets from 1Password
        id: secrets
        uses: ./.github/actions/op-secrets
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      # The dispatch authenticates as the netrics Release Bot GitHub App
      # (installed on netrics-cloud only, Contents: write). App credentials
      # come from 1Password; the installation token minted here lives for one
      # hour and is never stored. No personal access token is involved.
      - name: Mint Release Bot installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ steps.secrets.outputs.release-bot-app-id }}
          private-key: ${{ steps.secrets.outputs.release-bot-private-key }}
          owner: netrics-so
          repositories: netrics-cloud

      - name: Trigger netrics-cloud release workflow
        env:
          CLOUD_DISPATCH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$CLOUD_DISPATCH_TOKEN" ]; then
            echo "::error::Release Bot token is empty. Check the OP_SERVICE_ACCOUNT_TOKEN secret and the 1Password 'GitHub Release Bot' item (see docs/release.md), then retry with workflow_dispatch."
            exit 1
          fi
          payload=$(jq -n \
            --arg release "$RELEASE" \
            --arg commit "$COMMIT" \
            --arg server "$SERVER_DIGEST_REF" \
            --arg web "$WEB_DIGEST_REF" \
            --arg renderer "$RENDERER_DIGEST_REF" \
            '{
              event_type: "release-candidate",
              client_payload: {
                release: $release,
                commit: $commit,
                images: {
                  server: $server,
                  web: $web,
                  renderer: $renderer
                }
              }
            }')
          curl -sfL -X POST \
            -H "Authorization: Bearer $CLOUD_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/netrics-so/netrics-cloud/dispatches \
            -d "$payload"
