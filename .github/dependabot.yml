# Dependency updates. Everything in this repository is pinned exactly
# (actions by commit SHA, base images by digest, npm packages by version), so
# nothing moves without a reviewed pull request. The cooldown keeps brand-new
# releases out: an update is proposed only once it has been public for a week.
version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /apps/server
      - /apps/web
      - /apps/renderer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      compose-images:
        patterns: ["*"]
