# Dependency updates. Everything in this repository is pinned exactly
# (actions by commit SHA, base images by digest, npm packages by version), so
# nothing moves without a reviewed pull request. The cooldown keeps brand-new
# releases out: an update is proposed only once it has been public for a week.
version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /apps/server
      - /apps/web
      - /apps/renderer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Node follows the LTS line (ADR 0003): digest and patch updates within
    # 24-alpine arrive here; moving to the next LTS is a deliberate change.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # A PostgreSQL major version cannot open the previous major's data
    # directory, so bumping it would break every self-hosted upgrade. That
    # needs a documented dump/restore path, not a tag change.
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: caddy
        update-types: [version-update:semver-major]
    groups:
      compose-images:
        patterns: ["*"]
