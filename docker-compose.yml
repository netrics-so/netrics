services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: netrics
      POSTGRES_PASSWORD: netrics
      POSTGRES_DB: netrics
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netrics -d netrics"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
